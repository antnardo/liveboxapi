[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liveboxapi"
dynamic = ["version"]
description = "A synchronous client for Orange Livebox routers: read the state, change the settings, and ask the box what else it can do."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "antnardo", email = "antnardo@users.noreply.github.com" }]
keywords = ["livebox", "orange", "router", "sysbus", "softathome", "home-automation", "networking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31",
]

[project.scripts]
livebox = "liveboxapi.cli:main"

[project.urls]
Homepage = "https://github.com/antnardo/liveboxapi"
Documentation = "https://github.com/antnardo/liveboxapi/blob/main/docs/DOC.md"
Repository = "https://github.com/antnardo/liveboxapi"
Issues = "https://github.com/antnardo/liveboxapi/issues"
Changelog = "https://github.com/antnardo/liveboxapi/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
]

# La version vit dans le module : une seule source, que le workflow de
# publication compare au tag.
[tool.hatch.version]
path = "src/liveboxapi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/liveboxapi"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PTH", "RET"]
ignore = ["RUF001", "RUF002", "RUF003"]  # unicode look-alikes: the prose uses typographic dashes

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: talks to a real box; needs LIVEBOX_PASSWORD and a reachable gateway",
]

[tool.coverage.run]
source = ["src/liveboxapi"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = ["src"]
explicit_package_bases = true
ignore_missing_imports = true
